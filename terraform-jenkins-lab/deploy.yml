---
- name: Deploy Crypto Application
  hosts: workers
  become: true

  tasks:

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/crypto-app
        state: directory
        mode: "0755"

    - name: Copy Docker Compose file
      ansible.builtin.template:
        src: deploy/compose.yml
        dest: /opt/crypto-app/compose.yml
        mode: "0644"

    - name: Pull Docker image
      ansible.builtin.command:
        cmd: docker compose -f /opt/crypto-app/compose.yml pull
      environment:
        IMAGE_TAG: "{{ image_tag }}"

    - name: Start application
      ansible.builtin.command:
        cmd: docker compose -f /opt/crypto-app/compose.yml up -d
      environment:
        IMAGE_TAG: "{{ image_tag }}"
